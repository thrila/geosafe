services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJI_API_KEY: ${DJI_API_KEY:?Set DJI_API_KEY in your environment}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - geosafe-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  geosafe-data:
